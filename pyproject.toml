[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-data-pipeline"
version = "0.1.0"
description = "Financial transaction fraud detection data engineering pipeline"
requires-python = ">=3.10"

dependencies = [
    "apache-airflow==2.9.1",
    "pytest==8.3.2",
    "snowflake-connector-python==3.12.2",
    "pyspark==3.5.3",
    "boto3==1.35.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
